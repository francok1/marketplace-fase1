apiVersion: v1
kind: Namespace
metadata:
  name: marketplace

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: marketplace
data:
  NODE_ENV: production
  LOG_LEVEL: info

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: marketplace
type: Opaque
stringData:
  DATABASE_URL: postgresql://user:password@postgres:5432/marketplace
  REDIS_URL: redis://redis:6379
  NEXTAUTH_SECRET: your-secret-here
  STRIPE_SECRET_KEY: sk_live_xxxxx

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: marketplace
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: marketplace
      component: app

  template:
    metadata:
      labels:
        app: marketplace
        component: app
    spec:
      containers:
        - name: app
          image: ghcr.io/marketplace/app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: marketplace
spec:
  selector:
    app: marketplace
    component: app
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app-hpa
  namespace: marketplace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app

  minReplicas: 3
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-pdb
  namespace: marketplace
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: marketplace
      component: app

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-network-policy
  namespace: marketplace
spec:
  podSelector:
    matchLabels:
      app: marketplace
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432 # PostgreSQL
        - protocol: TCP
          port: 6379 # Redis
        - protocol: TCP
          port: 53  # DNS
